[package]
name = "acdc-parser"
description = "`AsciiDoc` parser using PEG grammars"
version = "0.9.0"
edition.workspace = true
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nlopes/acdc"
documentation = "https://docs.rs/acdc-parser"
keywords = ["asciidoc", "parser", "markup"]
categories = ["parsing", "text-processing"]
exclude = [
    "AGENTS.md",
    "README.adoc",
    "benches/",
    "examples/",
    "fixtures/",
    "proptest-regressions/",
    "tests/",
]

[features]
default = ["pre-spec-subs"]
network = ["dep:ureq"]
setext = []  # Enable Setext-style (underlined) header parsing
# Asciidoctor-compatible subs= attribute. Experimental - may be removed when AsciiDoc spec finalizes.
# See: https://gitlab.eclipse.org/eclipse/asciidoc-lang/asciidoc-lang/-/issues/16
pre-spec-subs = []

[dependencies]
bitflags = "2.11"
bumpalo = { version = "3", features = ["collections"] }
csv = "1.4"
encoding_rs = "0.8"
# PINNED, AND PINNED EXACTLY (`=`), because this is a LICENCE constraint rather
# than a version preference.
#
# evalexpr relicensed to AGPL-3.0-only at v12.0.0 (2024-10-17). Everything up to
# and including 11.3.1 (2024-10-13) is MIT. AGPL requires anyone who DISTRIBUTES
# the combined work to publish its complete source; this crate is statically
# linked into glyph-core, which ships inside the Mac, Windows, iOS and Android
# apps, so shipping v12+ is incompatible with a closed-source product.
#
# `=` and not `^`: a caret requirement would silently accept a hypothetical
# 11.3.2 published under the new licence, which is exactly the failure this pin
# exists to prevent.
#
# Used in ONE place — `preprocessor/conditional.rs`, the arithmetic fallback of
# `ifeval::[...]`, reached only when the value is neither a plain bool nor a
# plain number. `eval_float` / `eval_int` behave identically on 11.3.1
# (verified: `2 + 3.5` -> 5.5, `7 * 6` -> 42).
#
# Cost of the pin: no upstream fixes past 2024-10. If that ever matters, the
# replacement candidates measured at the time were rsc (MIT, maintained),
# fasteval (MIT, unmaintained since 2020) and rhai (MIT/Apache, maintained, but a
# whole scripting engine for what is a four-operator expression).
evalexpr = "=11.3.1"
peg = "0.8.6"
rustc-hash.workspace = true
self_cell = "1"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
url = "2.5"
# Network support for remote includes (optional - saves ~8s compile time when disabled)
ureq = { version = "3.1", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
crossterm = "0.29"
pretty_assertions.workspace = true
proptest = "1.9"
rstest.workspace = true
# Tiny tracking global allocator for the `no_leak` integration test. Encapsulates
# its own `unsafe impl GlobalAlloc` so the workspace `forbid(unsafe_code)` lint
# stays untouched.
stats_alloc = "0.1"
tracing-test.workspace = true

[[bench]]
name = "parser_bench"
harness = false

# Include / partial-include perf bench. Disabled by default (`bench`/`test` = false)
# so `cargo bench`, `cargo test`, and CI never run it — it generates temp fixtures
# and takes minutes. Run on demand: `cargo bench --bench f1_include_bench`.
[[bench]]
name = "f1_include_bench"
harness = false
bench = false
test = false

# Active/inactive block-conditional benchmark. Disabled by default so ordinary
# workspace bench/test commands skip the longer Criterion run. Run on demand:
# `cargo bench --bench conditional_bench`.
[[bench]]
name = "conditional_bench"
harness = false
bench = false
test = false

[lints]
workspace = true
