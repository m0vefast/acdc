[package]
name = "acdc-glyph-wasm"
version = "0.1.0"
edition.workspace = true
description = "Parse + render-html WASM bindings for acdc, designed for Glyph integration"
repository = "https://github.com/m0vefast/acdc"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acdc-parser = { workspace = true, features = ["setext", "pre-spec-subs"] }
acdc-converters-core = { workspace = true, features = ["pre-spec-subs"] }
acdc-converters-html = { workspace = true, features = ["pre-spec-subs"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-mutable-globals",
    "--enable-reference-types",
]

# Mirror workspace lint config (Round 2 dropped the `unsafe_code = allow`
# opt-out — `js_sys::Function` auto-derives Send+Sync via wasm-bindgen's
# blanket `JsValue` impl on `not(target_feature = "atomics")`, so no
# `unsafe impl` is needed in this crate).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
wildcard_enum_match_arm = "deny"
indexing_slicing = "deny"
fallible_impl_from = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
pedantic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
